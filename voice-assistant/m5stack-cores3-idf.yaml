        if(id(text_request).state.length()>32) {
          std::string name = id(text_request).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_request).state = (truncated+"...").c_str();
        }

  - id: text_response
    platform: template
    on_value:
      lambda: |-
        if(id(text_response).state.length()>32) {
          std::string name = id(text_response).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_response).state = (truncated+"...").c_str();
        }

color:
  - id: idle_color
    hex: ${idle_illustration_background_color}
  - id: listening_color
    hex: ${listening_illustration_background_color}
  - id: thinking_color
    hex: ${thinking_illustration_background_color}
  - id: replying_color
    hex: ${replying_illustration_background_color}
  - id: loading_color
    hex: ${loading_illustration_background_color}
  - id: error_color
    hex: ${error_illustration_background_color}
  - id: active_timer_color
    hex: "26ed3a"
  - id: paused_timer_color
    hex: "3b89e3"

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

# Touch (FT6336) replaces the S3-BOX-3's GPIO0 button (the CoreS3 lacks it — that
# pin is the I2S MCLK here). Whole-screen, so it works in either rotation:
#   * tap         -> stop: cancel an agent conversation and/or silence a ringing timer
#   * ~1 s hold   -> push-to-talk: start listening (stands in for the wake word)
#   * 5 idle taps -> slide-to-reset screen (a resting object is one continuous
#                    touch, never 5 taps, so it can't reach this)
# On the reset screen, dragging the handle to the far end factory-resets; a tap,
# an aborted slide, or 10 s idle dismisses it. FT6336 reset is on AW9523 P0_0.
#
# HARDWARE LIMIT: touch is POLLED. The FT6336 INT is on the AW9523 expander
# (P1_2), not an ESP32 GPIO, so it can't drive an ESPHome touchscreen interrupt
# (and ESPHome runs every component loop on one core — touch + display together —
# so it can't be offloaded to the 2nd core without a custom tasked driver). Brief
# taps that land during a loop stall (wake-word inference / a redraw) can be
# dropped, so the 5-tap reset may take a few extra deliberate taps. This is
# accepted, not a bug. See CoreS3-Lite-hardware.md.
touchscreen:
  - platform: ft63x6
    id: cs3_touch
    i2c_id: i2c_adc_dac
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration: {x_min: 0, x_max: 320, y_min: 0, y_max: 240}
    on_touch:
      - if:
          # On the reset screen the touch drives the slider (see on_update); skip
          # the push-to-talk arming.
          condition:
            lambda: "return !id(reset_mode);"
          then:
            # Start listening AFTER 1 s of holding — fires WHILE still held, not
            # on release. on_release clears touch_active, cancelling this if the
            # touch ended before 1 s.
            - lambda: |-
                id(touch_active) = true;
                id(touch_ptt_started) = false;
            - delay: 1s
            - if:
                condition:
                  lambda: "return id(touch_active) && !id(reset_mode);"
                then:
                  - lambda: "id(touch_ptt_started) = true;"
                  - script.execute: stop_wake_word
                  - voice_assistant.start:
          else:
            # Reset screen: only arm the slide if the press starts on the handle
            # (left of the track). A tap on the X / triangle leaves it disarmed so
            # on_release just cancels.
            - lambda: |-
                int sx = touch.x, sy = touch.y;
                if (id(orientation) == 180) { sx = 320 - sx; sy = 240 - sy; }
                id(slide_armed) = (sx <= 110 && sy >= 120 && sy <= 220);
    on_update:
      # Only when a handle-drag is in progress: the handle follows the finger.
      - if:
          condition:
            lambda: "return id(reset_mode) && id(slide_armed);"
          then:
            - lambda: |-
                if (!touches.empty()) {
                  int fx = touches[0].x;
                  // Touch coords are physical; the display is rotated 180 in the
                  // upside-down orientation, so mirror X to match what's drawn.
                  if (id(orientation) == 180) fx = 320 - fx;
                  id(reset_slide_x) = fx;
                }
            - script.execute: reset_timeout
            - if:
                condition:
                  lambda: "return id(reset_slide_x) >= 280;"
                then:
                  - lambda: "id(reset_mode) = false;"
                  - button.press: factory_reset_btn
                else:
                  - script.execute: draw_display
    on_release:
      - lambda: "id(touch_active) = false;"
      - if:
          condition:
            lambda: "return id(reset_mode);"
          then:
            # Surplus entry-taps (within the grace window) are absorbed so
            # over-tapping to reach 5 doesn't dismiss the page. After that, a
            # lift-off without reaching the end cancels (fail safe).
            - if:
                condition:
                  lambda: "return (millis() - id(reset_entered_ms)) > 700;"
                then:
                  - script.execute: exit_reset_mode
          else:
            - if:
                condition:
                  # Skip if the hold already started listening; else it was a tap.
                  lambda: "return !id(touch_ptt_started);"
                then:
                  # Tap stops whatever's active; if nothing is active (idle) it
                  # counts toward the 5-tap reset gesture.
                  - if:
                      condition:
                        voice_assistant.is_running:
                      then:
                        - voice_assistant.stop:
                        - lambda: "id(tap_count) = 0;"
                      else:
                        - if:
                            condition:
                              switch.is_on: timer_ringing
                            then:
                              - switch.turn_off: timer_ringing
                              - lambda: "id(tap_count) = 0;"
                            else:
                              - lambda: |-
                                  uint32_t now = millis();
                                  if (now - id(last_tap_ms) > 2000) id(tap_count) = 0;
                                  id(tap_count) += 1;
                                  id(last_tap_ms) = now;
                              - if:
                                  condition:
                                    lambda: "return id(tap_count) >= 5;"
                                  then:
                                    - lambda: "id(tap_count) = 0;"
                                    - script.execute: enter_reset_mode

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: M5CORE
    invert_colors: true
    data_rate: 40MHz
    cs_pin:
      number: GPIO3
      ignore_strapping_warning: true
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    update_interval: never
    pages:
      - id: idle_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_idle), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
          id(draw_active_timer_widget).execute();
          id(draw_battery_widget).execute();
      - id: listening_page
        lambda: |-
          it.fill(id(listening_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_listening), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
      - id: thinking_page
        lambda: |-
          it.fill(id(thinking_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_thinking), ImageAlign::CENTER);
          it.filled_rectangle(20 , 20 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 20 , 280 , 30 , Color::BLACK );
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
          id(draw_timer_timeline).execute();
      - id: replying_page
        lambda: |-
          it.fill(id(replying_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_replying), ImageAlign::CENTER);
          it.filled_rectangle(20 , 20 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 20 , 280 , 30 , Color::BLACK );
          it.filled_rectangle(20 , 190 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 190 , 280 , 30 , Color::BLACK );
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
          it.printf(30, 195, id(font_response), Color::BLACK, "%s", id(text_response).state.c_str());
          id(draw_timer_timeline).execute();
      - id: timer_finished_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_timer_finished), ImageAlign::CENTER);
      - id: error_page
        lambda: |-
          it.fill(id(error_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_error), ImageAlign::CENTER);
      - id: no_ha_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_ha), ImageAlign::CENTER);
      - id: no_wifi_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_wifi), ImageAlign::CENTER);
      - id: initializing_page
        lambda: |-
          it.fill(id(loading_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_initializing), ImageAlign::CENTER);
      - id: muted_page
        lambda: |-
          it.fill(Color::BLACK);
          id(draw_timer_timeline).execute();
          id(draw_active_timer_widget).execute();
      - id: reset_page
        # Language-agnostic factory-reset confirm: warning triangle + a slide
        # track whose ">>" handle follows the finger. Drag it past the far end to
        # reset; the X corner / a tap / 10 s idle cancels. No text -> no fonts to
        # localise.
        lambda: |-
          it.fill(Color::BLACK);
          // Warning triangle with "!"
          it.line(160, 16, 124, 72, id(error_color));
          it.line(124, 72, 196, 72, id(error_color));
          it.line(196, 72, 160, 16, id(error_color));
          it.printf(160, 30, id(font_timer), id(error_color), TextAlign::TOP_CENTER, "!");
          // Cancel hint: an X in the top-right corner
          it.line(296, 8, 312, 24, Color::WHITE);
          it.line(312, 8, 296, 24, Color::WHITE);
          // Instruction (English, same font as the no-HA/no-WiFi screen text)
          it.printf(160, 92, id(font_request), Color::WHITE, TextAlign::TOP_CENTER, "Swipe to reset");
          // Slide track + progress fill + handle
          it.rectangle(24, 150, 272, 56, Color::WHITE);
          int fx = id(reset_slide_x);
          if (fx < 24) fx = 24;
          if (fx > 296) fx = 296;
          if (fx > 25) it.filled_rectangle(24, 150, fx - 24, 56, id(error_color));
          it.printf(fx, 178, id(font_timer), Color::WHITE, TextAlign::CENTER, ">>");
